name: Pipeline CI/CD - Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4


      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Despliegue automatico en AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.207.71.210 
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/proyecto
            cd /home/ec2-user/proyecto
            # Si tienes el código clonado en la instancia, puedes forzar un pull o copia:
            sudo docker-compose down
            sudo docker-compose up --build -d